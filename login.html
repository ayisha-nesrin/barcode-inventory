<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AEC Inventory - Login</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1a56db">
<style>
  /* Mobile-first: phones are the primary target. min-height:100dvh (rather
     than 100vh) avoids the classic mobile bug where the browser's address
     bar cuts off the bottom of the card. The card also scrolls internally
     on very short screens (e.g. landscape phones) instead of overflowing. */
  :root{--blue:#1a56db;--bg:#f3f5f9;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}
  body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);margin:0;display:flex;min-height:100dvh;align-items:center;justify-content:center;padding:20px;padding-top:calc(20px + env(safe-area-inset-top));padding-bottom:calc(20px + env(safe-area-inset-bottom));}
  .card{background:#fff;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.08);padding:28px 24px;width:100%;max-width:380px;max-height:calc(100dvh - 40px);overflow-y:auto;}
  h1{font-size:19px;margin:0 0 4px;color:#111827;}
  p.sub{color:#6b7280;font-size:13px;margin:0 0 22px;}
  label{display:block;font-size:13px;color:#374151;margin:14px 0 6px;font-weight:600;}
  input{width:100%;padding:13px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:16px;min-height:48px;}
  input:focus{outline:2px solid var(--blue);border-color:var(--blue);}
  button{width:100%;margin-top:22px;padding:14px;background:var(--blue);color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;min-height:50px;touch-action:manipulation;}
  button:hover{background:#1543ad;}
  button:active{background:#123a94;}
  .err{color:#dc2626;font-size:13px;margin-top:12px;display:none;}
  .hint{margin-top:18px;font-size:12px;color:#9ca3af;text-align:center;line-height:1.7;}

  @media (min-width: 641px) {
    .card{padding:36px 32px;}
    h1{font-size:21px;}
  }
  @media (max-height: 420px) and (orientation: landscape) {
    body{padding:12px;align-items:flex-start;}
    .card{padding:18px 22px;margin-top:8px;}
    h1{font-size:17px;}
    p.sub{margin-bottom:12px;}
    label{margin:8px 0 4px;}
    input{min-height:40px;padding:9px 12px;}
    button{margin-top:14px;min-height:42px;padding:10px;}
    .hint{margin-top:10px;}
  }
</style>
</head>
<body>
<div class="card">
  <h1>AEC Barcode Inventory</h1>
  <p class="sub">Sign in to scan products or manage inventory</p>
  <form id="loginForm">
    <label>Username</label>
    <input type="text" id="username" autocomplete="username" required>
    <label>Password</label>
    <input type="password" id="password" autocomplete="current-password" required>
    <div class="err" id="err"></div>
    <button type="submit">Sign In</button>
  </form>
  <div class="hint">Demo admin: <b>admin</b> / admin123<br>Demo scanner: <b>scanner1</b> / scanner123<br>(change these in the Users tab once logged in)</div>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const errEl = document.getElementById('err');
  errEl.style.display = 'none';
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (!res.ok) {
      errEl.textContent = data.error || 'Login failed';
      errEl.style.display = 'block';
      return;
    }
    window.location.href = data.user.role === 'admin' ? '/admin.html' : '/scan.html';
  } catch (err) {
    errEl.textContent = 'Connection error';
    errEl.style.display = 'block';
  }
});
</script>
</body>
</html>
